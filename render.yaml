services:
  - type: web
    name: snacke-live
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/tiktok/account
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: TIKTOK_TARGET
        value: rainz878
